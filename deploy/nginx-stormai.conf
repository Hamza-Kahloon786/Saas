# /etc/nginx/sites-available/stormai  (symlink into sites-enabled)
# HTTP only on purpose: `certbot --nginx` adds the HTTPS server block and redirect.

server {
    listen 80;
    listen [::]:80;
    server_name stormai.decodersdigital.net;

    root /var/www/stormai/Frontend/dist;
    index index.html;

    client_max_body_size 25M;

    # ---- Backend API (incl. WebSockets under /api/v1/ws/...) ----
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Chatbot widget also probes these WebSocket paths first
    location ~ ^/(test-ws|test-chatbot/) {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Uploaded avatars and health check
    location /static/avatars/ { proxy_pass http://127.0.0.1:8010; proxy_set_header Host $host; }
    location = /health        { proxy_pass http://127.0.0.1:8010; proxy_set_header Host $host; }

    # ---- Frontend (React SPA) ----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
